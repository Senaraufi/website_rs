<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sena Raufi - Interactive Terminal Portfolio</title>
    <link rel="icon" href="./static/favicon.svg" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./terminal-style.css">
</head>
<body>
    <div id="terminal">
        <div class="terminal-header">
            <div class="terminal-buttons">
                <span class="btn close"></span>
                <span class="btn minimize"></span>
                <span class="btn maximize"></span>
            </div>
            <div class="terminal-title">sena@portfolio: ~</div>
            <div class="view-toggle">
                <a href="classic.html" class="toggle-link">Classic View</a>
            </div>
        </div>
        
        <div id="terminal-output" class="terminal-body"></div>
        
        <div class="input-line">
            <span class="prompt">sena@portfolio:~$</span>
            <input type="text" id="terminal-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        </div>
    </div>

    <script src="./terminal.js"></script>
</body>
</html>
