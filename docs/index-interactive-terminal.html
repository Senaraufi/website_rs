<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sena Raufi - Cybersecurity Portfolio</title>
    <link rel="icon" href="./static/favicon.svg" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Source+Code+Pro:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./terminal-style.css">
    <link rel="stylesheet" href="./static/style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0c0c0c;
        }

        #terminal-section {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
            background-color: #000;
        }

        #terminal {
            width: 100%;
            max-width: 1200px;
            height: 85vh;
            min-height: 600px;
        }

        .scroll-indicator {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            animation: bounce 2s infinite;
            cursor: pointer;
        }

        .scroll-indicator i {
            color: var(--terminal-green);
            font-size: 2rem;
            display: block;
            margin-bottom: 5px;
        }

        .scroll-indicator span {
            color: var(--terminal-green);
            font-size: 0.9rem;
            font-family: 'Source Code Pro', monospace;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateX(-50%) translateY(0);
            }
            40% {
                transform: translateX(-50%) translateY(-10px);
            }
            60% {
                transform: translateX(-50%) translateY(-5px);
            }
        }

        #portfolio-section {
            background-color: #121212;
        }

        #portfolio-section .container {
            padding-top: 40px;
        }

        @media (max-width: 768px) {
            #terminal-section {
                padding: 0;
                height: 100vh;
            }

            #terminal {
                height: 100vh;
                max-width: 100%;
                border-radius: 0;
                border: none;
            }

            .scroll-indicator {
                bottom: 10px;
            }

            .scroll-indicator i {
                font-size: 1.5rem;
            }

            .scroll-indicator span {
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <!-- Terminal Section (Landing) -->
    <section id="terminal-section">
        <div id="terminal">
            <div class="terminal-header">
                <div class="terminal-buttons">
                    <span class="btn close"></span>
                    <span class="btn minimize"></span>
                    <span class="btn maximize"></span>
                </div>
                <div class="terminal-title">sena@portfolio: ~</div>
            </div>
            
            <div id="terminal-output" class="terminal-body"></div>
            
            <div class="input-line">
                <span class="prompt">sena@portfolio:~$</span>
                <input type="text" id="terminal-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
            </div>
        </div>

        <div class="scroll-indicator" onclick="document.getElementById('portfolio-section').scrollIntoView({behavior: 'smooth'})">
            <i class="fas fa-chevron-down"></i>
            <span>Scroll for Classic View</span>
        </div>
    </section>

    <!-- Classic Portfolio Section -->
    <section id="portfolio-section">
        <nav class="navbar">
            <div class="navbar-container">
                <div class="navbar-logo">
                    <span class="terminal-prompt">sena@cybersec:~$</span>
                </div>
                <button class="navbar-toggle" id="navbar-toggle" aria-label="Toggle navigation menu">
                    <span class="toggle-bar"></span>
                    <span class="toggle-bar"></span>
                    <span class="toggle-bar"></span>
                </button>
                <div class="navbar-links" id="navbar-links">
                    <a href="#about" class="nav-link">About</a>
                    <a href="#skills" class="nav-link">Skills</a>
                    <a href="#achievements" class="nav-link">Achievements</a>
                    <a href="#projects" class="nav-link">Projects</a>
                    <a href="#certifications" class="nav-link">Certifications</a>
                    <a href="#contact" class="nav-link">Contact</a>
                </div>
                <div class="theme-toggle-container">
                    <button id="theme-toggle" class="theme-toggle-btn">
                        <span class="theme-toggle-text">Toggle Theme</span>
                    </button>
                </div>
            </div>
        </nav>
        
        <div class="container" id="classic-content">
            <!-- Content will be loaded from classic.html -->
        </div>
    </section>

    <!-- Load terminal functionality -->
    <script src="./terminal.js"></script>
    <script src="./static/script.js"></script>
    
    <script>
        // Load classic portfolio content after page loads
        window.addEventListener('load', function() {
            fetch('classic.html')
                .then(response => response.text())
                .then(html => {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    const container = doc.querySelector('.container');
                    if (container) {
                        document.getElementById('classic-content').innerHTML = container.innerHTML;
                    }
                })
                .catch(err => console.error('Error loading classic content:', err));
        });

        // Smooth scroll to sections
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(() => {
                document.querySelectorAll('.nav-link').forEach(link => {
                    link.addEventListener('click', (e) => {
                        e.preventDefault();
                        const targetId = link.getAttribute('href');
                        const targetElement = document.querySelector(targetId);
                        if (targetElement) {
                            targetElement.scrollIntoView({ behavior: 'smooth' });
                        }
                    });
                });
            }, 1000);
        });
    </script>
</body>
</html>
